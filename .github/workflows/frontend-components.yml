name: Streamlit React component build

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-components.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-components.yml"

jobs:
  component-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/superkart_ui/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/superkart_ui/frontend/package.json

      - name: Pin npm to the stable v10 release
        run: npm install --global npm@10.9.4

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck and build React component
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Streamlit component package
        working-directory: frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Verify packaged component metadata
        working-directory: frontend
        run: python -c "import importlib.metadata as m; d=m.distribution('superkart-ui'); assert any(str(p) == 'superkart_ui/pyproject.toml' for p in (d.files or [])); print('Component metadata is included in the installed package')"

      - name: Verify component definition loads
        working-directory: frontend
        run: python -c "from superkart_ui import prediction_reveal; print('React component definition loaded')"
